<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="FlakeLedger banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1519"/>
      <stop offset="1" stop-color="#131d24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#2e8f84"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" fill="url(#bg)"/>
  <g stroke="#1d2a33" stroke-width="1">
    <path d="M0 65 H960 M0 130 H960 M0 195 H960 M240 0 V260 M480 0 V260 M720 0 V260"/>
  </g>
  <text x="48" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#eef4f6">FlakeLedger</text>
  <text x="48" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8fb0b8">one test, many runs: flaky or broken, with the retry cost attached</text>
  <g transform="translate(48 152)">
    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="0" y="12" fill="#9fb8c0">run 1</text><rect x="64" y="0" width="26" height="18" rx="4" fill="#2a1d20" stroke="#6b3a40"/><text x="77" y="13" fill="#e0a3a3" text-anchor="middle">F</text>
      <text x="0" y="40" fill="#9fb8c0">run 2</text><rect x="64" y="28" width="26" height="18" rx="4" fill="#1d2a22" stroke="#35604a"/><text x="77" y="41" fill="#a9d29b" text-anchor="middle">P</text>
      <text x="0" y="68" fill="#9fb8c0">run 3</text><rect x="64" y="56" width="26" height="18" rx="4" fill="#2a1d20" stroke="#6b3a40"/><text x="77" y="69" fill="#e0a3a3" text-anchor="middle">F</text>
      <text x="120" y="40" fill="#3fb6a8">= flaky</text>
    </g>
    <rect x="230" y="4" width="120" height="64" rx="8" fill="#14232a" stroke="#2e5468"/>
    <text x="290" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8fb0b8" text-anchor="middle">flake tax</text>
    <text x="290" y="54" font-family="Consolas, Menlo, monospace" font-size="15" fill="#d7ecef" text-anchor="middle">18m / week</text>
